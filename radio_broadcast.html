<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Rádio do Tempo</title>
</head>
<body>

  <h1>Rádio do Tempo</h1>

<center>
<audio id="audioPlayer" autoplay controls>
    <source id="audioSource" src="/assets/tape/F1LA.mp3" type="audio/mp3">
    Seu navegador não suporta áudio.
</audio>
</center>

<script type="text/javascript" charset="utf-8">

    // Função que determina qual áudio tocar com base no horário
    function getAudioSrcByTime() {
      const agora = new Date();
      const hora = agora.getHours();

      if (hora >= 6 && hora < 12) {
        return "/assets/tape/F1LB.mp3"; // 06:00 - 11:59
      } else if (hora >= 12 && hora < 18) {
        return "/assets/tape/F1LA.mp3"; // 12:00 - 17:59
      } else {
        return "/assets/tape/F2LA.mp3"; // 18:00 - 05:59
      }
    }

    const audio = document.getElementById("audioPlayer");
    const source = document.getElementById("audioSource");

    // Antes de tocar, trocar a fonte do áudio com base na hora
    audio.addEventListener("play", function () {
      const novaFonte = getAudioSrcByTime();

      if (source.src.indexOf(novaFonte) === -1) {
        source.src = novaFonte;
        audio.load();
        audio.play();
      }
    });
  </script>

</body>
</html>
